server {
    listen 80;
    server_name 213.176.67.222;
    location /.well-known/acme-challenge/ { root /var/www/iom-acme; }
    location / { return 302 https://213.176.67.222:3443$request_uri; }
}
server {
    listen 3443 ssl;
    error_page 497 =302 https://213.176.67.222:3443$request_uri;
    server_name 213.176.67.222;
    ssl_certificate /etc/letsencrypt-iom/live/iom-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-iom/live/iom-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
}
